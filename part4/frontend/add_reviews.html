<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBnB — Add a Review</title>
    <link rel="icon" type="image/png" href="images/icon.png" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="scripts/main.js"></script>
  </head>
  <body>
    <header>
      <a href="index.html" class="logo-text">
        <img src="images/logo.png" alt="HBnB logo" />
      </a>
      <nav>
        <a href="index.html">Places</a>
        <a href="login.html" class="login-button" id="login-link">Login</a>
      </nav>
    </header>

    <main class="form-page-wrapper">
      <div class="form-container">
        <h2>Leave a Review</h2>
        <p class="form-subtitle" id="review-place-name">
          Share your experience
        </p>

        <form class="form" id="review-form">
          <div class="form-group">
            <label>Your rating</label>
            <div class="stars-input" role="group" aria-label="Rating">
              <input type="radio" id="star5" name="rating" value="5" required />
              <label for="star5" title="5 stars">&#9733;</label>

              <input type="radio" id="star4" name="rating" value="4" />
              <label for="star4" title="4 stars">&#9733;</label>

              <input type="radio" id="star3" name="rating" value="3" />
              <label for="star3" title="3 stars">&#9733;</label>

              <input type="radio" id="star2" name="rating" value="2" />
              <label for="star2" title="2 stars">&#9733;</label>

              <input type="radio" id="star1" name="rating" value="1" />
              <label for="star1" title="1 star">&#9733;</label>
            </div>
          </div>

          <div class="form-group">
            <label for="review-text">Your review</label>
            <textarea
              id="review-text"
              name="review"
              placeholder="Tell others about your stay — what did you love, what could be improved?"
              required
              minlength="10"
              maxlength="1000"
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Submit Review</button>
        </form>

        <p class="form-footer-link" id="back-link">
          <a href="index.html">&larr; Back to places</a>
        </p>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 HBnB. All rights reserved.</p>
    </footer>
  </body>
</html>
